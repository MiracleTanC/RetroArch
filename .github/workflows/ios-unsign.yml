name: Build RetroArch iOS (Unsigned IPA for iOS18.7 / iOS20)
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout RetroArch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          depth: 1

      - name: Install deps
        run: |
          brew install cmake wget unzip

      - name: Download prebuilt cores (nestopia snes9x genesis_plus_gx fceumm gambatte)
        run: |
          mkdir -p pkg/apple/iOS/modules
          CORES=("nestopia" "snes9x" "genesis_plus_gx" "fceumm" "gambatte")
          BASE_URL="https://buildbot.libretro.com/nightly/apple/ios-arm64/latest"
          for CORE in "${CORES[@]}"; do
            ZIP_NAME="${CORE}_libretro.dylib.zip"
            wget -q "${BASE_URL}/${ZIP_NAME}" -O "${ZIP_NAME}"
            unzip -q "${ZIP_NAME}" -d pkg/apple/iOS/modules/
            rm -f "${ZIP_NAME}"
          done
          ls -la pkg/apple/iOS/modules/

      - name: Xcode build archive
        run: |
          cd pkg/apple
          xcodebuild archive \
            -project RetroArch_iOS13.xcodeproj \
            -scheme "RetroArch iOS Release" \
            -destination generic/platform=iOS \
            -configuration Release \
            -archivePath $GITHUB_WORKSPACE/retroarch.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export unsigned IPA
        run: |
          cat > export-options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string></string>
            <key>provisioningProfiles</key>
            <dict/>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath $GITHUB_WORKSPACE/retroarch.xcarchive \
            -exportOptionsPlist export-options.plist \
            -exportPath $GITHUB_WORKSPACE/output

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetroArch-iOS-unsigned
          path: output/*.ipa
          retention-days: 14
