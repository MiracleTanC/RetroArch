name: Build RetroArch iOS (Unsigned IPA for Sideloadly)
on:
  push:
    branches: [ master ]
  workflow_dispatch: # 支持手动点按钮打包，非常方便

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout RetroArch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          depth: 1

      - name: Install deps
        run: |
          brew install cmake wget

      - name: Build libretro cores（编译核心，重点！）
        run: |
          git clone https://github.com/libretro/libretro-super.git
          cd libretro-super
          sh libretro-fetch.sh
          sh libretro-build-ios-arm64.sh
          # 把编译好的dylib拷贝到RA iOS模块目录
          mkdir -p ../pkg/apple/iOS/modules
          cp dist/ios-arm64/*.dylib ../pkg/apple/iOS/modules/

      - name: Xcode build archive
        run: |
          cd pkg/apple
          xcodebuild archive \
            -project RetroArch_iOS13.xcodeproj \
            -scheme "RetroArch iOS Release" \
            -destination generic/platform=iOS \
            -configuration Release \
            -archivePath $GITHUB_WORKSPACE/retroarch.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export unsigned IPA
        run: |
          cat > export-options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string></string>
            <key>provisioningProfiles</key>
            <dict/>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath $GITHUB_WORKSPACE/retroarch.xcarchive \
            -exportOptionsPlist export-options.plist \
            -exportPath $GITHUB_WORKSPACE/output

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetroArch-iOS-unsigned
          path: output/*.ipa
          retention-days: 14
